# Its OWN workspace: this crate lives inside the repo but must not join the root
# workspace, which would drag scratch-probe deps into the shipped lockfile. Same
# pattern as crates/me-cli/fuzz. Without this, `cargo build` here fails with
# "current package believes it's in a workspace when it's not" -- which is
# exactly what README.md's Reproduce section told you to run.
[workspace]

[package]
name = "mt-size-probe"
version = "0.0.0"
edition = "2021"

[dependencies]
miniscript = { version = "13.1.0", features = ["base64"] }
bitcoin = { version = "0.32.101", features = ["base64"] }
bip39 = "2"
qrcode = { version = "0.14", default-features = false }

[profile.dev]
opt-level = 2
