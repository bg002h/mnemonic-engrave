# Serve the SeedHammer II demo at https://quantoshi.xyz/SH2
#
# Paste this INSIDE the existing `server { server_name quantoshi.xyz ... }`
# block in deploy/nginx/quantoshi.conf, alongside `location /assets/`. It is
# static files only: no proxy, no app, nothing that can reach the Quantoshi
# process.
#
# THE MIME TYPE IS LOAD-BEARING. WebAssembly.instantiateStreaming() refuses a
# response that is not `application/wasm` and fails with an opaque error that
# looks like a corrupt build. Recent nginx ships wasm in mime.types; older ones
# do not, so it is declared here rather than assumed. Verify after deploying:
#
#   curl -sI https://quantoshi.xyz/SH2/emu/emu.wasm | grep -i content-type
#   -> content-type: application/wasm
#
location /SH2/ {
    alias /opt/quantoshi/sh2/;
    index index.html;

    # THE MIME TYPE IS LOAD-BEARING. WebAssembly.instantiateStreaming() refuses
    # a response that is not `application/wasm` and fails with an opaque error
    # that looks like a corrupt build. Recent nginx ships wasm in mime.types;
    # older ones do not, so it is declared rather than assumed.
    types { application/wasm wasm; }
    default_type text/html;

    # NO NESTED regex location here, deliberately. The first draft had one to
    # cache .wasm/.js/.css for a day:
    #
    #     location ~* ^/SH2/.*\.(wasm|js|css)$ { alias /opt/quantoshi/sh2/; ... }
    #
    # `alias` inside a REGEX location must use captures from that regex. Without
    # them nginx does not map the URI the way the plain-prefix case does, and the
    # result is a 404 on precisely the three file types the page cannot start
    # without. Caching granularity is not worth a broken emulator.
    #
    # One short cache for everything instead: long enough to spare the 11 MB wasm
    # on a page refresh, short enough that a redeploy is visible within minutes,
    # which matters far more while the page is being shown to a room.
    add_header Cache-Control "public, max-age=300";

    # The wasm compresses to roughly a third.
    gzip on;
    gzip_types application/wasm application/javascript text/css text/html;
    gzip_min_length 1024;
}
