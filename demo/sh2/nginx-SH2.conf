# Serve the SeedHammer II demo at https://quantoshi.xyz/SH2
#
# THIS FILE IS THE DEPLOYED CONFIGURATION, synced from the live server after the
# deploy rather than written ahead of it. Everything below is running now.
#
# It took SIX corrections to get here, and every one of them passed `nginx -t`
# and was only caught by fetching a real URL. They are documented in place
# because each is a trap the next person would fall into identically.
#
# INSTALLATION. The `map` goes at the TOP OF THE FILE (it is an http-level
# directive, and site files are included inside http{}). The three `location`
# blocks go INSIDE the existing `server { server_name quantoshi.xyz ... }` that
# listens on 443. Then:
#
#     sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` validates BEFORE anything takes effect and `reload` keeps the old
# config running if the new one is bad. Never `restart`.
#
# VERIFY BY FETCHING, not by reading -- that is the whole lesson here:
#
#     curl -sI https://quantoshi.xyz/SH2/emu/emu.wasm  | grep -i content-type  # application/wasm
#     curl -sI https://quantoshi.xyz/SH2/missions.js   | grep -i content-type  # application/javascript
#     curl -sL -o /dev/null -w '%{url_effective}\n' https://quantoshi.xyz/sh2/mission.html?m=decaying
#     curl -s  -o /dev/null -w '%{http_code}\n'     https://quantoshi.xyz/     # Quantoshi unharmed

# ---------------------------------------------------------------- http level --
#
# CACHE POLICY BY FILE TYPE, WITHOUT A NESTED LOCATION.
#
# The first draft varied caching with a nested `location ~* \.(wasm|js|css)$`
# inside the alias'd prefix. `alias` in a REGEX location must use captures from
# that regex; without them nginx maps the URI wrongly and 404s exactly the files
# the page cannot start without. A `map` sidesteps location matching entirely.
#
# The wasm is 11 MB and immutable per deploy: cache it hard or every phone in the
# room re-downloads it on each reload. Everything else is small and changes with
# a redeploy, so keep it brief -- a stale page during a live demo costs far more
# than re-fetching a few KB.
map $uri $sh2_cache {
    default              "public, max-age=60";
    ~*\.wasm$            "public, max-age=86400, immutable";
}

# -------------------------------------------------------------- server level --
# These three go inside the 443 `server` block. ORDER DOES NOT MATTER to nginx,
# but the PRECEDENCE RULES DO -- see the note on `^~` below.

# Any other casing -- /sh2, /Sh2/, /sH2/mission.html -- canonicalises to /SH2/.
#
# `$is_args$args` is NOT optional: unlike `rewrite`, `return` does not carry the
# query string. Without it /sh2/mission.html?m=decaying lands on
# /SH2/mission.html with NO MISSION SELECTED -- and still answers 200, so nothing
# looks wrong until someone taps through the wrong walkthrough.
location ~* ^/sh2(?:/(.*))?$ {
    return 301 /SH2/$1$is_args$args;
}

# Without this, a bare `/SH2` SILENTLY SERVES QUANTOSHI.
#
# `location ^~ /SH2/` matches the slash-terminated prefix only, so `/SH2` falls
# through to `location /`, is proxied to the Dash app, and answers 200 with the
# WRONG SITE. Not a 404 -- no error at all. Everyone typing the URL from memory
# hits this.
location = /SH2 {
    return 301 /SH2/$is_args$args;
}

# `^~` IS LOAD-BEARING. nginx checks `=` first, then remembers the longest
# prefix, then tries REGEX locations -- and a matching regex WINS over the
# remembered prefix. Without `^~`, the case-insensitive regex above would also
# match the canonical /SH2/ and redirect it to itself: an infinite loop. `^~`
# tells nginx to stop at the prefix and skip regex evaluation.
#
# AND NOTE WHAT IS ABSENT: there is no `types { }` block and no `default_type`.
# A `types` block inside a location REPLACES the inherited MIME map rather than
# extending it. The first deploy carried `types { application/wasm wasm; }` to
# be safe about the wasm -- and every OTHER extension in the location lost its
# type, so missions.js was served as text/html and the browser refused the
# module under strict MIME checking. The cards never rendered. nginx 1.24
# already maps `application/wasm wasm;` in /etc/nginx/mime.types (verify with
# `grep wasm /etc/nginx/mime.types`), so inheriting the global map is correct
# AND sufficient. If a target lacks it, add it to the GLOBAL map -- never shadow
# the whole table in one location.
location ^~ /SH2/ {
    alias /opt/quantoshi/sh2/;
    index index.html;

    # THE MIME TYPE IS LOAD-BEARING. WebAssembly.instantiateStreaming() refuses
    # a response that is not `application/wasm` and fails with an opaque error
    # that looks like a corrupt build. Recent nginx ships wasm in mime.types;
    # older ones do not, so it is declared rather than assumed.

    # NO NESTED regex location here, deliberately. The first draft had one to
    # cache .wasm/.js/.css for a day:
    #
    #     location ~* ^/SH2/.*\.(wasm|js|css)$ { alias /opt/quantoshi/sh2/; ... }
    #
    # `alias` inside a REGEX location must use captures from that regex. Without
    # them nginx does not map the URI the way the plain-prefix case does, and the
    # result is a 404 on precisely the three file types the page cannot start
    # without. Caching granularity is not worth a broken emulator.
    #
    # One short cache for everything instead: long enough to spare the 11 MB wasm
    # on a page refresh, short enough that a redeploy is visible within minutes,
    # which matters far more while the page is being shown to a room.
    add_header Cache-Control $sh2_cache;

    # The wasm compresses to roughly a third.
    gzip on;
    gzip_types application/wasm application/javascript text/css text/html;
    gzip_min_length 1024;
}
