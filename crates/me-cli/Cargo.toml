[package]
name = "mnemonic-engrave"
version = "0.10.0"
edition = "2021"
description = "Prepare wallet backups and signed transactions for a SeedHammer II: `me sysw pack` builds the payload it engraves, from mt1 strings or a tx: record; bare `me` converts one md1/mk1/mt1 string to an NFC NDEF payload. Refuses secret ms1."
license = "MIT OR Unlicense"
repository = "https://github.com/bg002h/mnemonic-engrave"
homepage = "https://github.com/bg002h/mnemonic-engrave"
readme = "README.md"
keywords = ["bitcoin", "nfc", "seedhammer", "backup", "bech32"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "me"
path = "src/main.rs"

[lib]
name = "mnemonic_engrave"
path = "src/lib.rs"

[dependencies]
# The shared IO/safety MECHANISM, extracted from this crate's own main.rs.
# A PATH dependency: `cargo publish mnemonic-io-lib` is irreversible and
# operator-gated, and nothing here needs it published to build or test.
mnemonic-io-lib = { path = "../mnemonic-io-lib" }
# A GIT dependency pinned to a rev, not a crates.io version (F-449 stage 4a,
# SPEC_liana_unspendable_internal_key §9a). md-codec is unpublishable while it
# depends on the rust-miniscript git patch below, so crates.io stopped at 0.42
# -- which reads no wire version but 4, and fails every version-8 plate.
# cf35d61a is `descriptor-mnemonic-md-cli-v0.19.0` (md-codec 0.47.0). A rev,
# not the tag: a tag can be moved, a rev cannot. Same shape as mnemonic-toolkit.
#
# NEEDS the root `[patch.crates-io]` miniscript override: md-codec 0.47 calls
# APIs that exist only at that rev (`derive_at_index`, `Terminal::SortedMultiA`).
md-codec = { git = "https://github.com/bg002h/descriptor-mnemonic", rev = "cf35d61af0f058029df841f4882945e53f86cd4b" }
# §5.4's `address 0:` line -- the executable check the operator makes before
# anything is engraved. `md_codec::Descriptor::derive_address` is the derivation
# (md-codec's `derive` feature is default-on and already in this tree), and its
# signature takes a `bitcoin::Network`, so the type has to be nameable here.
#
# NOT a parser dependency: §4.7 weighed `rust-miniscript` for PARSING and
# rejected it, and that decision stands -- `descriptor::cascade` is still the
# small seven-shape parser. This is the same use the constellation sibling makes
# of it (`descriptor-mnemonic` `crates/md-cli/Cargo.toml:34`, `cmd/address.rs:44`).
# It adds no crate to the tree: `bitcoin 0.32.101` is already in `Cargo.lock` as
# md-codec's own dependency, so the lock gains only this package's edge to it.
bitcoin = "0.32"
mk-codec = "0.5"
clap = { version = "4", features = ["derive"] }
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
# `zeroize` is not decoration: it is what puts `derive(Zeroize, ZeroizeOnDrop)`
# on `Mnemonic` (bip39 2.2.2 src/lib.rs:178). Without it a parsed passphrase
# mnemonic is dropped in the clear, which undercuts every `Zeroizing` wrapper
# this crate puts around the same words. Found by the Phase 2 Rust-side review.
bip39 = { version = "2.2", features = ["zeroize"] }
rand = "0.9"
# A GIT dependency pinned to a rev, exactly as mt-codec below and for the same
# reason: SPEC_hashlock_kinds §9 says phase 3 pins phase 2 BY REV, not by a
# publish. ms-codec 0.10.0 (the four hash kinds) is not on crates.io and
# deliberately so -- publishing is irreversible and pinning a rev is not, and
# scheduling `cargo publish` mid-cycle would put an irreversible act before
# anything has been proven on a device.
#
# Pinned to origin/master of mnemonic-secret. Bumped past phase 2 for F-546:
# the phrase screen learned that a digest-shaped phrase WARNS rather than
# refuses (F-539), and `--emit-record` learned the phrase record carries the
# METHOD axis and not the KIND axis. The old pin predated both, so `me` was
# validating against a corpus the host had already moved.
ms-codec = { git = "https://github.com/bg002h/mnemonic-secret", rev = "e5dff6f9c2b7ae7dc02a4a137e7322abab32211e" }
# The mt1 wire format -- the PRIMARY for everything sysw::mt converges on.
# A path dependency because mt-codec lives in a private sibling repo
# (mnemonic-transaction) and is unpublished; the layout is the constellation's
# standard side-by-side checkout. A release build of `me` would need mt-codec
# published or vendored -- recorded in IMPLEMENTATION_LOG_B.md.
# A GIT dependency pinned to a rev, not a path and not a publish.
#
# The path form does not resolve in CI: `mnemonic-transaction` is NOT a
# submodule of this repo (`.gitmodules` carries only `third_party/seedhammer`),
# so `../../../mnemonic-transaction` does not exist in a fresh checkout and
# cargo fails before a single test runs.
#
# A git dep works TODAY because the repo is public, needs no deploy key, and --
# the point -- keeps `cargo publish mt-codec` DEFERRED. Publishing is
# irreversible; pinning a rev is not.
#
# Pinned to origin/main rather than the local HEAD, and that is checked rather
# than assumed: `git diff origin/main..HEAD -- crates/mt-codec/` is EMPTY. The
# six unpushed commits touch `mt-cli` and the spec only, and `me` depends on
# `mt-codec`. So this needs no push -- an outward-facing act -- to build.
mt-codec = { git = "https://github.com/bg002h/mnemonic-transaction", rev = "72b79b8762ec208b6143afade8c4b66a551bd29d" }
rpassword = "7.5.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Property-testing layer (Cycle C / F18). MSRV of all proptest 1.x ≤ 1.85.0 (CI).
proptest = "1"
tempfile = "3"
